<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>软件下载</title>
<style>
:root{
--bg:#f2f3f5;--fg:#222;--w:#fff;--bd:#ddd;--inbg:#fafafa;--pri:#3b82f6;--err:#e11d48;
--muted:#888;--low:#2563eb;--mid:#d9a400;--high:#dc2626;--dis:#c9ccd1;--empty:#999;
--ph:#e9e9e9;--line:#f0f0f0;--navbd:#e6e6e6;--navfg:#8a8a8a;--danger:#ef4444;--tabfg:#666;
--tagbg:#eef2ff;--inbd:#e3e3e3;--tip:#aaa;--body:#444;--sh:0 1px 3px rgba(0,0,0,.07);--ov:rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
#gate{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--w);padding:24px;z-index:10}
#gate h1{font-size:20px;font-weight:600;margin-bottom:22px}
#code{width:100%;max-width:320px;height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;font-size:16px;outline:none;background:var(--inbg)}
#code:focus{border-color:var(--pri);background:var(--w)}
#enter{width:100%;max-width:320px;height:46px;margin-top:14px;border:none;border-radius:10px;background:var(--pri);color:var(--w);font-size:16px}
#enter:active{opacity:.85}
#tipline{margin-top:12px;font-size:13px;color:var(--err);min-height:18px}
#main{display:none;padding-bottom:74px}
#searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px}
#search{width:100%;height:42px;border:none;border-radius:21px;padding:0 18px;font-size:15px;outline:none;background:var(--w);box-shadow:var(--sh)}
#list{padding:4px 12px}
.card{display:flex;align-items:center;background:var(--w);border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.985)}
.card img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--ph);flex:0 0 auto}
.info{flex:1 1 auto;min-width:0;margin-left:12px}
.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riskLine{font-size:11px;line-height:1.5;margin-top:5px;white-space:normal;font-weight:600}
.riskLow{color:var(--low)}
.riskMid{color:var(--mid)}
.riskHigh{color:var(--high)}
.riskCircle{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;font-size:10px;font-weight:800;line-height:1;margin-right:3px;vertical-align:-1px}
.dl{flex:0 0 auto;margin-left:10px;padding:9px 16px;border-radius:8px;background:var(--pri);color:var(--w);font-size:13px;text-decoration:none}
.dl:active{opacity:.85}
.dl.disabled{background:var(--dis);color:var(--w)}
.empty{text-align:center;color:var(--empty);font-size:14px;padding:40px 0}
#detailView,#uploadView,#profileView{display:none}
.dtop{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px}
.back{border:none;background:var(--w);border-radius:20px;padding:9px 16px;font-size:14px;color:var(--pri);box-shadow:var(--sh);cursor:pointer}
.back:active{opacity:.7}
.ptitle{font-size:16px;font-weight:600;padding:8px 4px}
.dcontent{padding:2px 12px 24px}
.dhead{display:flex;align-items:center;background:var(--w);border-radius:12px;padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.dicon{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--ph);flex:0 0 auto}
.dmeta{margin-left:14px;min-width:0;flex:1 1 auto}
.dname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dver{font-size:13px;color:var(--muted);margin-top:6px}
.section{background:var(--w);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.sectionTitle{font-size:14px;font-weight:600;margin-bottom:10px}
.sectionBody{font-size:14px;line-height:1.75;color:var(--body);white-space:pre-wrap;word-break:break-word}
.previewGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.previewImg{width:100%;border-radius:8px;display:block;background:var(--ph)}
.previewEmpty{font-size:14px;color:var(--empty)}
.dinfo{background:var(--w);border-radius:12px;padding:2px 14px;box-shadow:var(--sh);margin-bottom:10px}
.row{display:flex;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.rowLabel{color:var(--muted);flex:0 0 98px}
.rowValue{color:var(--fg);flex:1 1 auto;word-break:break-word}
#nav{position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--w);border-top:1px solid var(--navbd);display:none;z-index:30}
.navBtn{flex:1;height:100%;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--navfg);cursor:pointer}
.navBtn .ico{font-size:19px;line-height:1}
.navBtn.active{color:var(--pri)}
.ucontent{padding:0 12px 24px}
.bigBtn{width:100%;height:46px;border:none;border-radius:10px;background:var(--pri);color:var(--w);font-size:15px;font-weight:600;cursor:pointer}
.bigBtn:active{opacity:.85}
.bigBtn.danger{background:var(--danger);margin-top:16px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tab{flex:1;white-space:nowrap;padding:9px 8px;border:none;border-radius:8px;background:var(--w);color:var(--tabfg);font-size:13px;box-shadow:var(--sh);cursor:pointer}
.tab.active{background:var(--pri);color:var(--w)}
.miniCard{background:var(--w);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.miniName{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniSub{font-size:12px;color:var(--muted);margin-top:6px}
.statusTag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--tagbg);color:var(--pri);margin-left:8px}
#uploadForm{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg);z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#uploadForm.show{display:block}
.fcontent{padding:4px 12px 40px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:var(--tabfg);margin-bottom:6px}
.fg input,.fg textarea{width:100%;border:1px solid var(--inbd);border-radius:10px;background:var(--w);padding:11px 13px;font-size:14px;outline:none;font-family:inherit}
.fg textarea{min-height:86px;resize:vertical;line-height:1.6}
.fg input:focus,.fg textarea:focus{border-color:var(--pri)}
.uploadTip{font-size:12px;color:var(--empty);text-align:center;margin:14px 0 10px;line-height:1.6}
.pcard{background:var(--w);border-radius:12px;padding:20px 16px;box-shadow:var(--sh);margin:0 12px}
.avatarBox{display:flex;justify-content:center;margin-bottom:8px}
.avatarImg{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--ph);border:3px solid var(--bg);cursor:pointer}
.pavatarTip{text-align:center;font-size:12px;color:var(--tip);margin-bottom:18px}
.prow{display:flex;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-of-type{border-bottom:none}
.plabel{color:var(--muted);flex:0 0 92px}
.pval{flex:1;word-break:break-word;font-weight:500}
.pinput{width:100%;height:44px;border:1px solid var(--inbd);border-radius:10px;padding:0 14px;font-size:15px;outline:none;background:var(--inbg);margin-bottom:12px}
.pinput:focus{border-color:var(--pri);background:var(--w)}
.ptitle2{font-size:17px;font-weight:600;text-align:center;margin-bottom:20px}
.ploginTip{font-size:13px;color:var(--err);min-height:18px;margin-bottom:10px;text-align:center}
.overlay{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--ov);display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
.overlay.show{display:flex}
.modalBox{background:var(--w);border-radius:14px;width:100%;max-width:320px;padding:22px 20px;text-align:center}
.modalTitle{font-size:17px;font-weight:700;margin-bottom:12px;color:var(--high)}
.modalBody{font-size:14px;color:var(--body);line-height:1.7;margin-bottom:20px}
.modalBtn{width:100%;height:44px;border:none;border-radius:10px;background:var(--pri);color:var(--w);font-size:15px;font-weight:600;cursor:pointer}
.modalBtn:active{opacity:.85}
</style>
</head>
<body>
<div id="gate">
  <h1>请输入邀请码</h1>
  <input id="code" type="text" placeholder="邀请码" autocomplete="off">
  <button id="enter">进入</button>
  <div id="tipline"></div>
</div>

<div id="main">
  <div id="listView">
    <div id="searchbar">
      <input id="search" type="text" placeholder="搜索软件名或版本号" autocomplete="off">
    </div>
    <div id="list"></div>
  </div>

  <div id="detailView">
    <div class="dtop">
      <button class="back" id="backBtn">← 返回</button>
    </div>
    <div class="dcontent" id="detailContent"></div>
  </div>

  <div id="uploadView">
    <div class="dtop"><div class="ptitle">软件上传</div></div>
    <div class="ucontent">
      <button class="bigBtn" id="openFormBtn">＋ 软件上传</button>
      <div class="tabs" id="uploadTabs">
        <button class="tab active" data-t="已通过">已通过</button>
        <button class="tab" data-t="在审核">在审核</button>
        <button class="tab" data-t="暂未通过">暂未通过</button>
        <button class="tab" data-t="已下架">已下架</button>
      </div>
      <div id="uploadList"></div>
    </div>
  </div>

  <div id="profileView">
    <div class="dtop"><div class="ptitle">个人主页</div></div>
    <div id="profileContent" style="padding-bottom:24px"></div>
  </div>

  <div id="nav">
    <button class="navBtn active" data-tab="home"><span class="ico">🏠</span>主页</button>
    <button class="navBtn" data-tab="upload"><span class="ico">📤</span>上传</button>
    <button class="navBtn" data-tab="profile"><span class="ico">👤</span>个人主页</button>
  </div>
</div>

<div id="uploadForm">
  <div class="dtop"><button class="back" id="formBack">← 返回</button></div>
  <div class="fcontent">
    <div class="fg"><label>软件名称</label><input id="f_name" type="text" autocomplete="off"></div>
    <div class="fg"><label>版本号</label><input id="f_ver" type="text" autocomplete="off"></div>
    <div class="fg"><label>包名</label><input id="f_pkg" type="text" autocomplete="off"></div>
    <div class="fg"><label>原作者全名</label><input id="f_author" type="text" autocomplete="off"></div>
    <div class="fg"><label>下载链接</label><input id="f_url" type="text" autocomplete="off"></div>
    <div class="fg"><label>更新公告（选填）</label><textarea id="f_log"></textarea></div>
    <div class="fg"><label>详细介绍</label><textarea id="f_desc"></textarea></div>
    <div class="fg"><label>其他可补充内容</label><textarea id="f_other"></textarea></div>
    <div class="fg"><label>软件大小</label><input id="f_size" type="text" autocomplete="off"></div>
    <div class="uploadTip">上传是通过您主动使用邮箱发送进行上传</div>
    <button class="bigBtn" id="doUpload">上传</button>
  </div>
</div>

<div class="overlay" id="modal">
  <div class="modalBox">
    <div class="modalTitle" id="modalTitle">禁止</div>
    <div class="modalBody" id="modalBody"></div>
    <button class="modalBtn" id="modalOk">我知道了</button>
  </div>
</div>
